<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#00C2E8" />
  <meta name="description" content="Wolt Clone Application" />
  <title>Wolt Clone</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wolt_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) { }
    })();
  </script>
</head>
<noscript>You need to enable JavaScript to run this app.</noscript>

<body>
  <div id="root"></div>
</body>

</html>
