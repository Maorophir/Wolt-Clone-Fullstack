
services:
  # --------------------------------------------------------
  # Service 1: The New Node.js Web Server (Ex3)
  # --------------------------------------------------------
  web-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wolt-web-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Critical for Epic 7: In Docker, containers communicate using service names, not localhost
      - RECOMMENDATION_SERVER_HOST=recommendation-server
      - RECOMMENDATION_SERVER_PORT=5555
    depends_on:
      - recommendation-server
    restart: unless-stopped

  # --------------------------------------------------------
  # Service 2: The C++ TCP Recommendation Server (Ex2)
  # --------------------------------------------------------
  recommendation-server:
    build:
      # Assumes the C++ project files (CMakeLists, src, Dockerfile) are in this folder
      context: ./cpp-server
      dockerfile: Dockerfile
    container_name: wolt-recommendation-server
    ports:
      - "5555:5555"
    volumes:
      # Persist user history data
      - ./data:/app/data
    restart: unless-stopped