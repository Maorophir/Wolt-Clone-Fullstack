services:
  # --------------------------------------------------------
  # Service 1: The Node.js Web Server (Ex3 & Ex5 - MongoDB Integrated)
  # --------------------------------------------------------
  web-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wolt-web-server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/wolt
      # Critical for Epic 7: In Docker, containers communicate using service names, not localhost
      - RECOMMENDATION_SERVER_HOST=recommendation-server
      - RECOMMENDATION_SERVER_PORT=5555
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - recommendation-server
      - mongodb
    restart: unless-stopped

  # --------------------------------------------------------
  # Service 2: The C++ TCP Recommendation Server (Ex2)
  # --------------------------------------------------------
  recommendation-server:
    build:
      # Assumes the C++ project files (CMakeLists, src, Dockerfile) are in this folder
      context: ./cpp-server
      dockerfile: Dockerfile
    container_name: wolt-recommendation-server
    ports:
      - "5555:5555"
    volumes:
      # Persist user history data
      - ./data:/app/data
    restart: unless-stopped

  # --------------------------------------------------------
  # Service 3: The React Frontend Application (Ex4)
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wolt-frontend
    ports:
      # Host port 3000 maps to Container port 3000 (resolves collision with Node.js port 3001)
      - "3000:3000"
    environment:
      # Optional: Explicitly tell the React app where to send API requests
      - REACT_APP_API_URL=http://localhost:3000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - web-server
    # Critical flags to keep Create React App running in the background inside Docker
    stdin_open: true
    tty: true
    restart: unless-stopped

  # --------------------------------------------------------
  # Service 4: MongoDB Database (Ex5)
  # --------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: wolt-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # --------------------------------------------------------
  # Service 5: React Native Mobile App (Ex5 - Expo)
  # --------------------------------------------------------
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: wolt-mobile
    ports:
      - "8081:8081"
    environment:
      # Tell Expo to use LAN mode and bind to all interfaces inside the container
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP}
      - EXPO_PUBLIC_API_URL=http://${HOST_IP}:3001/api
    volumes:
      - ./mobile:/app
      - /app/node_modules
    depends_on:
      - web-server
    stdin_open: true
    tty: true
    restart: unless-stopped

# Named volumes keep node_modules and DB data inside Docker, not on your hard drive
volumes:
  mongo-data: